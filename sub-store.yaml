# Clash / Mihomo 静态配置文件
# 功能特色：包含防 DNS / WebRTC 泄露策略、安全 DoH 分流与 Koolson 全彩图标
# sub-store 文件 使用

port: 7890
socks-port: 7891
mixed-port: 7890

# 局域网共享控制：默认 false 保证本机安全
# 💡 若需将本机代理共享给局域网内的手机、旁路由或其它设备，请将此处改为 true
allow-lan: false

# 运行模式：rule (规则分流) / global (全局代理) / direct (全局直连)
mode: rule

# 日志级别：info / warning / error / debug / silent
log-level: info

# RESTful API 控制端口与访问密码（防御恶意网页跨站探测与未授权提取节点凭据）
# 💡 建议保持监听 127.0.0.1，切勿轻易改为 0.0.0.0；强烈建议修改下方示例密码为自己的专属密钥（建议使用英文字母与数字组合，除下划线 _ 外切勿使用其他特殊符号，以免引发 YAML 解析错误或 Web 面板鉴权失败）
external-controller: 127.0.0.1:9090
secret: "Clash_ChangeMe_2026" # 👈 此处请修改为你自己的专属密钥（避免使用默认公开值）/sub-store 远程使用此链接，只需在 操作-脚本操作 填入引号里的代码即可自动替换“$content = $content.replace("Clash_ChangeMe_2026", "你的密钥");” 
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  prefer-h3: false
  respect-rules: true
  use-system-hosts: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - +.lan
    - +.local
    - +.msftconnecttest.com
    - +.msftncsi.com
    - localhost.ptlogin2.qq.com
    - localhost.sec.qq.com
    - +.in-addr.arpa
    - +.ip6.arpa
    - time.*.com
    - time.*.gov
    - pool.ntp.org
    - localhost.work.weixin.qq.com
  default-nameserver:
    - 223.5.5.5
    - 1.2.4.8
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    - https://8.8.4.4/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    geosite:private,cn:
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
