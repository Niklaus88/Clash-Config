# Clash / Mihomo 静态配置文件 (由 JS 覆写脚本静态转换生成)
# 功能特色：包含防 DNS / WebRTC 泄露策略、安全 DoH 分流与 Koolson 全彩图标

port: 7890
socks-port: 7891
mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  prefer-h3: false
  respect-rules: true
  use-system-hosts: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - +.lan
    - +.local
    - +.msftconnecttest.com
    - +.msftncsi.com
    - localhost.ptlogin2.qq.com
    - localhost.sec.qq.com
    - +.in-addr.arpa
    - +.ip6.arpa
    - time.*.com
    - time.*.gov
    - pool.ntp.org
    - localhost.work.weixin.qq.com
  default-nameserver:
    - 223.5.5.5
    - 1.2.4.8
  nameserver:
    - https://208.67.222.222/dns-query
    - https://77.88.8.8/dns-query
    - https://1.1.1.1/dns-query
    - https://8.8.4.4/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    geosite:private,cn:
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
# ==============================================================================
# 机场订阅配置区域 (支持填入 1 个或多个订阅链接)
# ==============================================================================
# 💡 使用说明：
# 1. 只有一个订阅：只需在 airport-1 的 url 处粘贴你的订阅链接，将 airport-2 和 airport-3 整段删除。
# 2. 有多个订阅：按格式在下方依次添加，每个订阅起一个唯一的英文字符名（如 airport-1, airport-2）。
# 3. 自动汇聚：所有代理策略组均已开启 include-all，客户端会自动拉取并将所有订阅的节点汇总合并，无需手动挑选！
# 4. 首次使用提示：导入配置后，请在客户端“代理/提供者 (Providers)”列表中点击一次 🔄 刷新以拉取节点。
proxy-providers:
  airport:
    type: http
    url: "https://airport-1.com/api/v1/client/subscribe?token=xxxx"  # 👈 【机场订阅链接】粘贴在此
    path: ./proxy_providers/airport-1.yaml
    interval: 86400  # 自动更新间隔时间（单位：秒，86400 即 24 小时）
    filter: "^(?!.*(官网|套餐|流量|异常|剩余)).*$"  # 自动过滤官网公告、剩余流量等非节点提示
    healthCheck:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300

proxy-groups:
